function dfs( xx,  y, current_label,item) {
  if (xx < 0 || xx == row_count) return; // out of bounds
  if (y < 0 || y == col_count) return; // out of bounds

  
  //if (x[xx][y]==current_label || x[xx][y]!=2 ) return; // already labeled or not marked with 1 in m
  if (label[xx][y]==current_label || x[xx][y]!=item ) return;
   
  // mark the current cell
  
  label[xx][y] = current_label;
  
  //shapecopy[xx][y].clone();
  x[xx][y]=-1;
  stage.removeChild(shapecopy[9-xx][9-y]);
  blocksPopped++;
  //stage.addChild();
  ////console.log("herer"+xx+"y"+y);
  // recursively mark the neighbors
  for (var direction = 0; direction < 4; ++direction)
    dfs(xx + dx[direction], y + dy[direction], current_label,item);
}
